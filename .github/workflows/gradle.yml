name: Java CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: rundeck-plugins/.github/.github/actions/setup-java@main
      - name: Get Fetch Tags
        run: git -c protocol.version=2 fetch --tags --progress --no-recurse-submodules origin
        if: "!contains(github.ref, 'refs/tags')"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get Release Version
        id: get_version
        run: VERSION=$(./gradlew currentVersion -q -Prelease.quiet) && echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Upload artifact jar
        uses: rundeck-plugins/.github/.github/actions/upload-artifact@main
        with:
          name: Rundeck-Azure-Plugin-${{ steps.get_version.outputs.VERSION }}
          path: build/libs/*-${{ steps.get_version.outputs.VERSION }}.jar