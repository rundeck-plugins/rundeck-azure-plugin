[versions]
axionRelease = "1.21.2"
groovy = "4.0.32"
rundeckCore = "6.1.0-SNAPSHOT"
azureResourceManagerCompute = "2.58.2"
azureIdentity = "1.18.1"
azureStorageBlob = "12.35.0"
commonsIo = "2.22.0"
commonsNet = "3.13.0"
commonsLang3 = "3.20.0"
junit = "4.13.2"
spock = "2.3-groovy-4.0"
bytebuddy = "1.18.11"
objenesis = "3.5"


[libraries]
rundeckCore = { group = "org.rundeck", name = "rundeck-core", version.ref = "rundeckCore" }
azureResourceManagerCompute = { group = "com.azure.resourcemanager", name = "azure-resourcemanager-compute", version.ref = "azureResourceManagerCompute" }
azureIdentity = { group = "com.azure", name = "azure-identity", version.ref = "azureIdentity" }
azureStorageBlob = { group = "com.azure", name = "azure-storage-blob", version.ref = "azureStorageBlob" }

groovyAll = { group = "org.apache.groovy", name = "groovy-all", version.ref = "groovy" }

# HTTP and Networking
commonsIo = { group = "commons-io", name = "commons-io", version.ref = "commonsIo" }
commonsNet = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }
commonsLang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
spockCore = { group = "org.spockframework", name = "spock-core", version.ref = "spock" }
objenesis = { group = "org.objenesis", name = "objenesis", version.ref = "objenesis" }
bytebuddy = { group = "net.bytebuddy", name = "byte-buddy", version.ref = "bytebuddy" }

[bundles]
testLibs = ["groovyAll", "junit","spockCore", "bytebuddy", "objenesis"]

[plugins]
axionRelease = { id = "pl.allegro.tech.build.axion-release", version.ref = "axionRelease" }